<ion-toolbar>
  <!--
    The title sits in a start slot rather than in ion-title: in iOS mode Ionic
    centres ion-title absolutely across the whole toolbar, so the buttons end
    up painted on top of it.
  -->
  <ion-buttons slot="start">
    <span class="app-title">{{ title }}</span>
  </ion-buttons>

  <ion-buttons slot="end">
    <ion-chip class="stat-chip">
      <ion-icon name="trophy" color="warning"></ion-icon>
      <ion-label class="stat-value">{{ level }}</ion-label>
    </ion-chip>
    <ion-chip class="stat-chip">
      <ion-icon name="star" color="primary"></ion-icon>
      <ion-label class="stat-value">{{ score$ | async }}</ion-label>
    </ion-chip>

    <ion-button
      class="icon-button"
      [attr.aria-label]="isMuted ? 'Activar sonido' : 'Silenciar'"
      (click)="onToggleSound()"
    >
      <ion-icon
        [name]="isMuted ? 'volume-mute' : 'volume-high'"
        aria-hidden="true"
      ></ion-icon>
    </ion-button>

    <ion-button class="icon-button" aria-label="Pausa" (click)="onPauseOrPlay()">
      <ion-icon name="pause" aria-hidden="true"></ion-icon>
    </ion-button>
  </ion-buttons>
</ion-toolbar>
