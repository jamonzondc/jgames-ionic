<ion-card class="game-card" [routerLink]="gameData.routerLink">
  <div class="game-card__media">
    <img [alt]="gameData.name" [src]="gameData.image" loading="lazy" />
    <ion-badge
      class="game-card__state"
      color="{{ gameData.state | getColorByState }}"
      >{{ gameData.state }}</ion-badge
    >
  </div>

  <div class="game-card__body">
    <h2 class="game-card__title">{{ gameData.name }}</h2>
    <p class="game-card__text">{{ gameData.description }}</p>
  </div>
</ion-card>
