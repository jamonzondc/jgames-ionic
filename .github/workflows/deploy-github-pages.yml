name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages con OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Solo un despliegue concurrente; no cancela el que ya está en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # base_path es "/jgames-ionic" en project pages y "/" en user/org pages
          HREF="${BASE_PATH%/}/"
          echo "base-href: $HREF"
          npx ng build --configuration production --base-href "$HREF"

      - name: Prepare SPA fallback
        # GitHub Pages no reescribe rutas: 404.html sirve la misma SPA para deep links.
        # .nojekyll evita que Jekyll ignore ficheros que empiezan por "_".
        run: |
          cp www/index.html www/404.html
          touch www/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
